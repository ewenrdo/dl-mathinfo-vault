name: Test LaTeX Compilation

on:
  push:
    branches: [ "main", "feat/ci", "opt/rewriting" ]
  pull_request:
    branches: [ "main", "feat/ci", "opt/rewriting" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # INDISPENSABLE pour récupérer ton dossier components !

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full latexmk

      - name: Find changed LaTeX files
        id: latexfiles
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            git diff --name-only origin/${{ github.base_ref }} HEAD | grep '\.tex$' > changed_tex.txt || true
          else
            # Pour un push simple, on compare avec le commit précédent
            git diff --name-only HEAD~1 HEAD | grep '\.tex$' > changed_tex.txt || true
          fi
          echo "Fichiers modifiés :"
          cat changed_tex.txt

      - name: Compile changed LaTeX files
        run: |
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "Compiling $file"
              dir=$(dirname "$file")
              # On se place dans le dossier du fichier et on utilise TEXINPUTS pour pointer vers le sous-module à la racine
              cd "$dir"
              TEXINPUTS=.:../../../../components//: latexmk -pdf -interaction=nonstopmode $(basename "$file") || exit 1
              cd - > /dev/null
            fi
          done < changed_tex.txt